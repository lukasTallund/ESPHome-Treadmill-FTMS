# Tunable motor-board limits, kept in one place instead of scattered
# hardcoded numbers across buttons/FTMS/HA-number entities. To try a
# different limit, change it here only - nothing else needs editing.
#
# Speed 20 km/h is confirmed working end-to-end on hardware (smooth
# ramp, no errors). Incline "level" doesn't map 1:1 to a real degree/%
# grade (measured: level 0 = 1.3°, level 18 = 4.7°, i.e. ~8.2% real
# grade at 18). The motor board's real ceiling was found empirically by
# testing well above the last-known-working value: it stops moving past
# level 20 (commands above that are silently ignored, no error) -
# extrapolating from the two measured points, that's ~5.1° / ~8.9% real
# grade. Confirmed via hardware testing on 2026-09-17 - don't raise this
# again without re-testing on the actual belt.
substitutions:
  speed_max_kmh: "20.0"       # km/h - HA "Set Speed", FTMS validation (float comparisons)
  speed_max_tenths: "200"     # same limit, internal tenths-of-km/h unit (target_speed_goal)
  incline_max_pct: "20.0"     # HA "Set Incline", FTMS validation, button guard (float comparisons)
  incline_max_level: "20"     # same limit, as a plain int for the two integer-typed level/number schemas
