# Sends periodic treadmill telemetry to a second, physically adjacent
# ESP32-S3 running TreadLink, over a dedicated UART link.
#
# Why: TreadLink was running BLE central (reading our FTMS server) and BLE
# peripheral (broadcasting RSC to a Garmin watch) plus WiFi at the same
# time on one radio. Reconnect attempts on the central side contended for
# radio time with the already-active Garmin link and crashed TreadLink
# (stack overflow after repeated failed BLE connections). This UART link
# lets TreadLink drop the BLE-central role entirely.
#
# TX carries treadmill telemetry out (below). RX carries read-only bridge
# diagnostics back from esp32-ant (link health: frame count, max gap,
# stale-fallback events) - not a command channel. A real control channel
# (Zwift-style commands relayed back to us) was intentionally never built:
# it would introduce a second command source alongside our own BLE FTMS
# Control Point with no arbitration between them.
uart:
  - id: uart_treadlink
    tx_pin: GPIO14
    rx_pin: GPIO21
    baud_rate: 115200

# Frame: [TM:<speed_001kmh 5-digit>:<incline_01pct signed 4-char>:<distance_m 5-digit>:<flags 2-hex>]\n
# Values mirror exactly what send_treadmill_data (30-scripts.yaml) already
# sends to Zwift over BLE FTMS, so the Garmin-via-TreadLink view matches
# the Zwift view instead of using a second, possibly-inconsistent source
# (e.g. the noisier FC-33-derived actual speed).
#
# NOTE for any consumer of this frame: despite the field name,
# speed_001kmh is in steps of 0.01 km/h (hundredths), not 0.001
# (thousandths) - trust the worked example below over the name. A
# downstream consumer (esp32-ant) initially trusted the name and got
# exactly 10x too-low speed/pace until they matched it to this example.
# Example: 00850 = 8.50 km/h (850 * 0.01), not 0.85 km/h.
interval:
  - interval: 700ms
    then:
      - lambda: |-
          float speed_kph = id(treadmill_speed_goal_sensor).state;
          float incline = id(treadmill_incline_goal_sensor).state;
          float distance_km = id(treadmill_distance_km).state;

          if (isnan(speed_kph)) speed_kph = 0.0f;
          if (isnan(incline)) incline = 0.0f;
          if (isnan(distance_km)) distance_km = 0.0f;

          // *100, not *1000 - see the frame-format note above the "interval:" key.
          int speed_001kmh = (int) lroundf(speed_kph * 100.0f);
          if (speed_001kmh < 0) speed_001kmh = 0;
          if (speed_001kmh > 99999) speed_001kmh = 99999;

          int incline_01pct = (int) lroundf(incline * 10.0f);
          if (incline_01pct < -999) incline_01pct = -999;
          if (incline_01pct > 9999) incline_01pct = 9999;

          int distance_m = (int) lroundf(distance_km * 1000.0f);
          if (distance_m < 0) distance_m = 0;
          if (distance_m > 99999) distance_m = 99999;

          uint8_t flags = 0x03;  // bit0=has_incline, bit1=has_distance

          char frame[38];
          snprintf(frame, sizeof(frame), "[TM:%05d:%04d:%05d:%02X]",
                   speed_001kmh, incline_01pct, distance_m, flags);
          id(uart_treadlink).write_str(frame);
          id(uart_treadlink).write_byte('\n');

          // Mirrors esp32-ant's own "frames" received counter, so the two
          // can be diffed over the same window to see directly whether
          // any frames are lost in transit, instead of inferring it from
          // gap times alone.
          static uint32_t frames_sent = 0;
          frames_sent++;
          id(treadlink_frames_sent).publish_state(frames_sent);

          // Sent every 700ms regardless; only logged on change (plus once
          // right after boot) so this confirms the link is alive without
          // spamming a line every tick.
          static int last_logged_speed = -1;
          static bool logged_once = false;
          if (speed_001kmh != last_logged_speed || !logged_once) {
            last_logged_speed = speed_001kmh;
            logged_once = true;
            ESP_LOGI("TreadLink", "Sent: %s", frame);
          }

  # Reads esp32-ant's bridge-health diagnostics back on the RX line.
  # Line formats (bracket-delimited, space-separated key=value):
  #   [ANT speed_kmh=8.50 distance_m=152 frames=42 max_gap_ms=680 stale_events=0
  #        broadcast_failures=0 max_loop_us=... ch_status=...]
  #   [ANT WAITING frames=42 max_gap_ms=680 stale_events=0]
  #   [ANT STALE gap_ms=2340 event=1]
  #   [ANT BOOT msg=...] / [ANT BOOT node_start=ok] / [ANT BOOT stride_open=0x00 device=0x5a17]
  # broadcast_failures/max_loop_us/ch_status are esp32-ant's own ANT+
  # radio-side health (channel status, broadcast failures, its own
  # main-loop-time equivalent) - added to rule their side in or out the
  # same way our own Loop Time sensor rules ours in or out.
  - interval: 200ms
    then:
      - lambda: |-
          static std::string buf;
          while (id(uart_treadlink).available()) {
            uint8_t c;
            id(uart_treadlink).read_byte(&c);
            if (c == '\n') {
              if (buf.size() >= 2 && buf.front() == '[' && buf.back() == ']') {
                std::string content = buf.substr(1, buf.size() - 2);  // strip [ ]
                if (content.rfind("ANT", 0) == 0) {
                  id(ant_last_line).publish_state(content);

                  bool is_stale = content.rfind("ANT STALE", 0) == 0;
                  bool is_boot = content.rfind("ANT BOOT", 0) == 0;
                  if (!is_boot) {
                    id(ant_bridge_stale).publish_state(is_stale);
                  }

                  auto extract_int = [&](const char *key) -> int {
                    std::string k = std::string(key) + "=";
                    auto pos = content.find(k);
                    if (pos == std::string::npos) return -1;
                    return atoi(content.c_str() + pos + k.size());
                  };
                  // For non-numeric values (e.g. ch_status may be hex like
                  // "0x03") - captures up to the next space or end of line.
                  auto extract_str = [&](const char *key) -> std::string {
                    std::string k = std::string(key) + "=";
                    auto pos = content.find(k);
                    if (pos == std::string::npos) return "";
                    auto start = pos + k.size();
                    auto end = content.find(' ', start);
                    return content.substr(start, end == std::string::npos ? std::string::npos : end - start);
                  };

                  int max_gap = extract_int("max_gap_ms");
                  if (max_gap >= 0) id(ant_max_gap_ms).publish_state(max_gap);

                  int stale_events = is_stale ? extract_int("event") : extract_int("stale_events");
                  if (stale_events >= 0) id(ant_stale_events).publish_state(stale_events);

                  int frames = extract_int("frames");
                  if (frames >= 0) id(ant_frames).publish_state(frames);

                  int broadcast_failures = extract_int("broadcast_failures");
                  if (broadcast_failures >= 0) id(ant_broadcast_failures).publish_state(broadcast_failures);

                  int max_loop_us = extract_int("max_loop_us");
                  if (max_loop_us >= 0) id(ant_max_loop_us).publish_state(max_loop_us);

                  std::string ch_status = extract_str("ch_status");
                  if (!ch_status.empty()) id(ant_channel_status).publish_state(ch_status);
                }
              }
              buf.clear();
              continue;
            }
            if (c >= 32 && c <= 126) {
              buf.push_back((char) c);
            }
            if (buf.size() > 96) buf.clear();
          }

text_sensor:
  - platform: template
    name: "ANT Bridge Last Line"
    id: ant_last_line
    icon: "mdi:radio-tower"
    entity_category: diagnostic

  - platform: template
    name: "ANT Channel Status"
    id: ant_channel_status
    icon: "mdi:radio-tower"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "ANT Bridge Stale"
    id: ant_bridge_stale
    icon: "mdi:alert-circle-outline"
    entity_category: diagnostic

sensor:
  - platform: template
    name: "ANT Bridge Max Gap"
    id: ant_max_gap_ms
    unit_of_measurement: "ms"
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "ANT Bridge Stale Events"
    id: ant_stale_events
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "ANT Bridge Frames"
    id: ant_frames
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "TreadLink Frames Sent"
    id: treadlink_frames_sent
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "ANT Broadcast Failures"
    id: ant_broadcast_failures
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "ANT Max Loop Time"
    id: ant_max_loop_us
    unit_of_measurement: "µs"
    entity_category: diagnostic
    accuracy_decimals: 0
